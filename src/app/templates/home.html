<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Binary Manager</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        :root{
            --blue:#1b4dcc;
            --bg:#f4f8ff;
            --card:#fff;
            --muted:#7488b3;
            --success:#29a854;
            --warning:#f1c40f;
            --danger:#e63946;
        }
        body{
            margin:0;
            font-family: "Segoe UI",sans-serif;
            background:var(--bg);
            color:#10243b;
            padding:28px;
            display:flex;
            justify-content:center;
        }
        .container{
            width:100%;
            max-width:980px;
            background:var(--card);
            border-radius:12px;
            padding:20px;
            box-shadow:0 8px 20px rgba(0,0,0,0.06);
        }
        h1{ color:var(--blue); margin:0 0 12px 0; text-align:center;}
        form{ display:grid; grid-template-columns: 1fr 200px; gap:12px; align-items:center; margin-bottom:18px;}
        label{ font-weight:600; color:var(--blue); margin-bottom:6px;}
        input[type=file], select { padding:8px; border-radius:8px; border:1px solid #dbe8ff; background:#f8fbff;}
        button.primary{ padding:10px 14px; background:var(--blue); color:white; border:none; border-radius:8px; cursor:pointer;}
        button.ghost{ padding:8px 12px; background:transparent; border:1px solid #e6eefc; border-radius:8px; cursor:pointer;}
        hr{ border:0; border-top:1px solid #e9f0ff; margin:18px 0;}
        .table-wrap{ overflow:auto;}
        table{ width:100%; border-collapse:collapse; min-width:800px;}
        th,td{ text-align:left; padding:10px 12px; border-bottom:1px solid #f1f6ff; font-size:14px}
        th{ font-weight:700; color:var(--muted); font-size:13px; background:#fbfdff; position:sticky; top:0;}
        .badge{ padding:6px 8px; border-radius:8px; color:white; font-weight:700; font-size:12px; display:inline-block;}
        .badge.pending{ background:var(--warning); color:#3b3000;}
        .badge.signed{ background:var(--success);}
        .badge.approved{ background:var(--success);}
        .small{ font-size:12px; color:var(--muted);}
        a.link{ color:var(--blue); text-decoration:none; font-weight:600;}
        .actions button{ margin-right:6px;}
        @media (max-width:700px){
            form{ grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Binary Manager</h1>

        <form id="uploadForm" enctype="multipart/form-data">
            <div>
                <label>Archivo</label>
                <input type="file" name="file" required>
            </div>

            <div>
                <label>Environment</label>
                <div id="emailField" style="display:none;">
                    <label>Correo para aprobación</label>
                    <input type="email" name="email" placeholder="correo@example.com">
                </div>

                <select name="environment" required>
                    <option value="dev">dev</option>
                    <option value="qa">qa</option>
                    <option value="prod">prod</option>
                </select>
            </div>

            <div style="display:flex; gap:8px; align-items:end;">
                <button class="primary" type="submit">Subir Archivo</button>
                <button class="ghost" type="button" id="refreshBtn">Refrescar</button>
            </div>
        </form>

        <div id="popup" style="display:none; padding:10px; border-radius:8px; margin-bottom:12px;"></div>

        <hr />

        <h2>Archivos Subidos</h2>

        <div class="table-wrap">
            <table id="filesTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Filename</th>
                        <th>Environment</th>
                        <th>Status</th>
                        <th>Upload Date</th>
                        <th>Signed File</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- rows dinámicos -->
                </tbody>
            </table>
        </div>
    </div>

<script>
const form = document.getElementById('uploadForm');
const popup = document.getElementById('popup');
const refreshBtn = document.getElementById('refreshBtn');
const tableBody = document.querySelector('#filesTable tbody');

async function loadFiles(){
    const envSelect = document.querySelector('select[name="environment"]');
    const emailField = document.getElementById('emailField');

    envSelect.addEventListener('change', () => {
        if (envSelect.value === 'prod') {
            emailField.style.display = 'block';
            emailField.querySelector('input').required = true;
        } else {
            emailField.style.display = 'none';
            emailField.querySelector('input').required = false;
        }
    });



    try{
        const res = await fetch('/files');
        if(!res.ok) return;
        const files = await res.json();
        tableBody.innerHTML = "";

        files.forEach(f => {
            const tr = document.createElement('tr');

            const idTd = document.createElement('td');
            idTd.textContent = f.id || "-";
            tr.appendChild(idTd);

            const nameTd = document.createElement('td');
            const shortName = (f.filename || "").split("/").slice(-1)[0] || f.filename || "-";
            nameTd.innerHTML = `<div style="font-weight:700">${shortName}</div><div class="small">${f.filename || ""}</div>`;
            tr.appendChild(nameTd);

            const envTd = document.createElement('td');
            envTd.textContent = f.environment || "-";
            tr.appendChild(envTd);

            const statusTd = document.createElement('td');
            const status = (f.status || "unknown").toLowerCase();
            const span = document.createElement('span');
            span.classList.add('badge');
            span.classList.add(status);
            span.textContent = status;
            statusTd.appendChild(span);
            tr.appendChild(statusTd);

            const uploadedTd = document.createElement('td');
            uploadedTd.textContent = f.uploaded_at ? new Date(f.uploaded_at).toLocaleString() : "-";
            tr.appendChild(uploadedTd);

            const signedTd = document.createElement('td');
            if(f.signed_file){
                const a = document.createElement('a');
                a.href = "/" + f.signed_file.replace(/^\//,'');
                a.textContent = f.signed_file.split('/').slice(-1)[0];
                a.className = 'link';
                a.target = '_blank';
                signedTd.appendChild(a);
            } else {
                signedTd.textContent = "-";
                signedTd.className = 'small';
            }
            tr.appendChild(signedTd);

            const actionsTd = document.createElement('td');
            actionsTd.className = 'actions';
            // Botón aprobar sólo si está pending y environment=prod
            if(status === "pending" && f.environment === "prod"){
                const btn = document.createElement('button');
                btn.textContent = "Aprobar";
                btn.className = 'primary';
                btn.style.padding = '6px 10px';
                btn.onclick = async () => {
                    btn.disabled = true;
                    const r = await fetch(`/approve?file_id=${encodeURIComponent(f.id)}`);
                    if(r.ok){
                        showPopup("Archivo aprobado correctamente", true);
                        loadFiles();
                    } else {
                        showPopup("No se pudo aprobar", false);
                        btn.disabled = false;
                    }
                };
                actionsTd.appendChild(btn);
            } else {
                actionsTd.textContent = "-";
            }

            tr.appendChild(actionsTd);

            tableBody.appendChild(tr);
        });

    }catch(e){
        console.error("Error loading files", e);
    }
}

function showPopup(text, ok=true){
    popup.style.display = 'block';
    popup.style.background = ok ? 'var(--success)' : '#e63946';
    popup.style.color = 'white';
    popup.textContent = text;
    setTimeout(()=> popup.style.display = 'none', 3500);
}

form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const formData = new FormData(form);

    try{
        const res = await fetch('/upload', {
            method: 'POST',
            body: formData
        });

        if(res.ok){
            const result = await res.json();
            showPopup(`✔ Archivo subido (${result.status})`, true);
            loadFiles();
            form.reset();
        } else {
            showPopup("Error al subir archivo", false);
        }
    }catch(err){
        console.error(err);
        showPopup("Error al subir archivo", false);
    }
});

refreshBtn.addEventListener('click', loadFiles);

// carga inicial
loadFiles();
</script>
</body>
</html>
